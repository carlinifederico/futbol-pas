<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Fútbol PAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&family=Inter:wght@400;600;700&display=swap">
<style>
/* Mobile-first: arriba la cancha fija (equipos + balance + acciones), abajo la lista de jugadores que scrollea sola. */
:root{
  --paper:#efe5cc; --paper-2:#e6d9b8; --card:#fbf6e6; --ink:#1b2140; --ink-soft:#4a4a5e; --celeste:#74acdf; --red:#d6453a; --mustard:#e2b93b;
  --chalk:#f7f1de; --navy-shirt:#1b2442; --white-shirt:#fbf8ee; --ok:#3f9a5c; --ok-bg:#e3efd9;
  --display:Anton,Impact,"Arial Narrow Bold","Arial Narrow",sans-serif; --type:"Courier Prime","Courier New",monospace; --body:Inter,system-ui,"Segoe UI",sans-serif;
  color-scheme:light; padding:0!important;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;height:100dvh;overflow:hidden;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.3;background:var(--paper);
  background-image:radial-gradient(rgba(27,33,64,.07) 1px,transparent 1.2px);background-size:6px 6px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,select,input{font:inherit;color:inherit}
.app{height:100%;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
/* ---- arriba ---- */
.top{flex:0 0 auto;height:52dvh;min-height:300px;max-height:600px;display:flex;flex-direction:column;gap:6px;padding:6px 10px 8px;background:var(--paper-2);border-bottom:3px solid var(--ink)}
.pitch{position:relative;flex:1 1 auto;min-height:0}
.pitch svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.mk,.slot{cursor:pointer}
.mk.hot .ring,.slot.hot .ring{opacity:1}
.bal{display:flex;align-items:center;gap:8px}
.track{position:relative;flex:1;height:22px;display:flex;border:2px solid var(--ink);overflow:hidden;background:var(--white-shirt)}
.track i{display:flex;align-items:center;font-style:normal;font-family:var(--display);font-size:12.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;transition:width .4s cubic-bezier(.3,1.3,.5,1)}
.track .a{background:var(--navy-shirt);color:var(--chalk);padding-left:6px}
.track .b{background:var(--white-shirt);justify-content:flex-end;padding-right:6px}
.track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:3px;margin-left:-1.5px;background:var(--mustard)}
.verd{flex:none;min-width:74px;text-align:center;font-family:var(--type);font-weight:700;font-size:11.5px;text-transform:uppercase;border:2px solid currentColor;padding:1px 5px;transform:rotate(-2deg);color:var(--ink-soft)}
.verd.v1{color:var(--ok)}.verd.v2{color:#9a7410}.verd.v3{color:var(--red)}
.acts{display:flex;gap:6px}
.btn{height:42px;min-width:42px;display:inline-grid;place-items:center;font-family:var(--display);font-size:15px;letter-spacing:.03em;text-transform:uppercase;border:2.5px solid var(--ink);
  background:var(--chalk);padding:0 10px;cursor:pointer;box-shadow:2px 2px 0 var(--red);transition:transform .08s;white-space:nowrap}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 var(--red)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.primary{flex:1;background:var(--mustard)}
.btn.ico{padding:0;font-family:var(--body);font-size:18px}
.btn:focus-visible,.face:focus-visible,.sl:focus-visible,.pos button:focus-visible,select:focus-visible,input:focus-visible{outline:3px dashed var(--red);outline-offset:2px}
/* ---- abajo ---- */
.list{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 10px calc(20px + env(safe-area-inset-bottom,0px))}
.lhead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:8px 0 7px;background:var(--paper);border-bottom:2px solid var(--ink)}
.lhead b{font-family:var(--display);font-weight:400;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.cnt{display:inline-block;background:var(--ink);color:var(--mustard);padding:0 6px;margin-left:2px}
.cnt.full{background:var(--ok);color:#fff}
.sync{font-family:var(--type);font-size:11px;font-weight:700;color:var(--ok);flex:1;text-align:right;white-space:nowrap}
.sync.wait{color:var(--ink-soft)}.sync.err{color:var(--red)}
.soy{display:flex;align-items:center;gap:4px;font-family:var(--type);font-size:12px;font-weight:700}
.soy select{height:32px;max-width:120px;border:2px solid var(--ink);background:#fff;font-family:var(--type);font-size:13px;padding:0 4px}
.tipbox{display:flex;align-items:flex-start;gap:8px;margin:8px 0 2px;padding:7px 8px 7px 10px;background:var(--ink);color:var(--chalk);font-family:var(--type);font-size:12.5px;line-height:1.35}
.tipbox span{flex:1}.tipbox b{color:var(--mustard)}
.tipbox button{flex:none;width:32px;height:32px;margin:-4px -4px -4px 0;border:0;background:none;color:var(--chalk);font-size:16px;cursor:pointer}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:50px minmax(0,1fr);gap:9px;align-items:center;padding:7px 6px 7px 4px;border-bottom:1px dashed rgba(27,33,64,.25);border-left:5px solid transparent}
.row.on{background:var(--ok-bg);border-left-color:var(--ok)}
.face{position:relative;width:50px;height:50px;padding:0;border:2px solid var(--ink);background:#fff;cursor:pointer;overflow:visible}
.face img,.face .nof{width:100%;height:100%;object-fit:cover;display:block}
.face .nof{display:grid;place-items:center;background:#25305a;color:#8d97c4;font-family:var(--display);font-size:24px}
.row:not(.on) .face{filter:grayscale(.55);opacity:.85}
.face .ck{position:absolute;right:-7px;bottom:-7px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid var(--ink);background:#fff;color:transparent}
.row.on .face .ck{background:var(--ok);color:#fff;border-color:#fff;box-shadow:0 0 0 1.5px var(--ok)}
.rm{min-width:0;display:flex;flex-direction:column;gap:5px}
.rt{display:flex;align-items:center;gap:6px;min-width:0}
.nm{flex:1;min-width:0;min-height:34px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0;border:0;background:none;cursor:pointer;text-align:left}
.nm span{font-family:var(--display);font-size:16px;text-transform:uppercase;line-height:1.05;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{font-family:var(--type);font-size:10.5px;color:var(--ink-soft)}.nm small.ok{color:var(--ok);font-weight:700}
.row.on .nm span{color:#25643a}
.pos{display:flex;flex:none}
.pos button{height:32px;min-width:38px;padding:0 3px;font-family:var(--type);font-size:11px;font-weight:700;border:1.5px solid var(--ink);margin-left:-1.5px;background:#fff;cursor:pointer}
.pos button[aria-pressed="true"].mine{background:var(--ink);color:var(--mustard)}
.pos button[aria-pressed="true"].avg{background:var(--celeste);color:var(--ink)}
.pos button[aria-pressed="true"].none{background:var(--paper-2)}
.sls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sl{display:flex;flex-direction:column;gap:2px;padding:2px 0 4px;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.sl .lb{font-family:var(--type);font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft)}
.sl .tr{position:relative;height:16px;border:1.5px solid var(--ink);background:#fff;overflow:hidden}
.sl .tr::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),rgba(27,33,64,.28) calc(20% - 1px) 20%)}
.sl .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--celeste);transition:width .15s}
.sl.mine .tr i{background:var(--ink)}
.sl.none .tr{border-color:rgba(27,33,64,.35)}.sl.none .tr i{background:rgba(27,33,64,.12)}.sl.none .lb{opacity:.6}
.me-note{font-family:var(--type);font-size:11px;color:var(--ink-soft)}
.addf{display:flex;gap:6px;margin-top:12px}
.addf input{flex:1;min-width:0;height:40px;border:2px solid var(--ink);background:#fff;padding:0 8px;font-family:var(--type);font-size:14px}
.rmv{width:34px;height:34px;border:1.5px solid var(--ink);background:#fff;cursor:pointer;flex:none}
/* ---- compu / apaisado: lado a lado ---- */
@media (min-width:860px),(orientation:landscape) and (min-width:560px) and (max-height:560px){
  .app{flex-direction:row}
  .top{height:100%;max-height:none;min-height:0;width:56%;border-bottom:0;border-right:3px solid var(--ink);padding:12px;justify-content:center;gap:10px}
  .pitch{flex:0 1 auto;width:100%;aspect-ratio:520/420}
  .list{padding-inline:14px}
}
dialog{border:3px solid var(--ink);background:var(--paper);color:var(--ink);padding:14px;width:min(440px,calc(100vw - 24px));box-shadow:6px 6px 0 var(--red)}
dialog::backdrop{background:rgba(20,18,10,.55)}
dialog h2{font-family:var(--display);font-weight:400;font-size:24px;text-transform:uppercase;margin:0 0 10px;line-height:1}
.dbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.frow{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-family:var(--type);font-size:12px;font-weight:700;text-transform:uppercase}
.seg{display:flex}
.seg button{flex:1;height:40px;font-family:var(--type);font-weight:700;font-size:13px;border:2px solid var(--ink);margin-left:-2px;background:#fff;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--mustard)}
#imgOut{display:block;width:100%;border:2px solid var(--ink)}
.hint{font-family:var(--type);font-size:12px;color:var(--ink-soft);margin:8px 0 0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--mustard);
  padding:8px 14px;font-family:var(--type);font-weight:700;font-size:13px;border:2px solid var(--mustard);z-index:60;max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.track i,.sl .tr i,.btn{transition:none}}
</style>

<div class="app">
  <section class="top" aria-label="Cancha">
    <div class="pitch"><svg id="pitch" viewBox="0 0 520 420" role="img" aria-label="Cancha con los dos equipos"></svg></div>
    <div class="bal" aria-live="polite"><div class="track"><i class="a" id="barA"></i><i class="b" id="barB"></i></div><span class="verd" id="verd">—</span></div>
    <div class="acts">
      <button class="btn primary" id="btnAuto" type="button">Armar parejos</button>
      <button class="btn" id="btnOther" type="button">Otra</button>
      <button class="btn" id="btnImg" type="button">Compartir</button>
      <button class="btn ico" id="btnForm" type="button" aria-label="Formación">⚙</button>
    </div>
  </section>
  <section class="list" id="list" aria-label="Jugadores">
    <div class="lhead"><b>Jugadores <span class="cnt" id="cnt">0/10</span></b><span class="sync" id="sync"></span>
      <label class="soy">Soy <select id="soy"></select></label></div>
    <div class="tipbox" id="tip" hidden><span>1) Tocá a los 10 que juegan · 2) <b>Armar parejos</b><br>Mové las barritas para calificar (es secreto).</span><button type="button" id="tipX" aria-label="Cerrar">✕</button></div>
    <div class="rows" id="rows"></div>
    <form class="addf" id="addFrm"><input id="aName" maxlength="20" placeholder="Invitado sin figurita" aria-label="Nombre del invitado"><button class="btn" type="submit">+ Sumar</button></form>
  </section>
</div>

<dialog id="fDlg">
  <h2>Formación</h2>
  <div id="fRows"></div>
  <div class="dbar"><button class="btn" type="button" onclick="this.closest('dialog').close()">Listo</button></div>
</dialog>
<dialog id="imgDlg">
  <img id="imgOut" alt="Cancha con los equipos">
  <p class="hint">Mantené apretada la imagen para guardarla o copiarla.</p>
  <div class="dbar"><button class="btn" type="button" id="imgShare" hidden>Enviar</button><button class="btn" type="button" id="imgCopy">Copiar</button><button class="btn" type="button" onclick="this.closest('dialog').close()">Cerrar</button></div>
</dialog>

<script>
/* Plantel base. Los puntajes son internos: nunca se muestran. */
const ROSTER=[
 {id:'r1',name:'Elias',r:6,f:'elias'},{id:'r2',name:'Lauti',r:7.5,f:'lauti'},{id:'r3',name:'Colo',r:4,f:'colo'},
 {id:'r4',name:'Charly',r:5,f:'charly'},{id:'r5',name:'Fede Carlini',r:7.5,f:'fede-carlini'},{id:'r6',name:'Nico',r:7.5,gkr:7.5,f:'nico'},
 {id:'r7',name:'Hermano Pedro',r:6.5,f:'hermano-pedro'},{id:'r8',name:'Pedro',r:6,gkr:6,f:'pedro'},{id:'r9',name:'Fede Codino',r:8,f:'fede-codino'},
 {id:'r10',name:'Nacho',r:7.5,f:'nacho'},{id:'r11',name:'Gustavo 4to',r:6.5,f:null,mystery:'REFUERZO MISTERIOSO'},
 {id:'r12',name:'Pato Wall',r:6,f:'pato-wall'},{id:'r13',name:'Martín',r:6,f:'martin'},
 {id:'r14',name:'Fede Bianchini',r:6,f:'fede-bianchini'},{id:'r15',name:'JP',r:6,f:'jp'},
 {id:'r16',name:'Mauro',r:6,f:'mauro'}];
const POS_S=[['ANY','Cualq.'],['DEF','Def'],['MED','Med'],['DEL','Del']];
/* Cada rasgo va de -2 a +2 (en pantalla 1..5). */
const ATTRS=[['vel','Velocidad','VEL'],['fis','Físico','FÍS'],['pre','Precisión','PRE'],['res','Aguante','AGU']];
const FORMS={
 '2-2':[{t:'DEF',x:112,y:472},{t:'DEF',x:288,y:472},{t:'DEL',x:112,y:366},{t:'DEL',x:288,y:366}],
 '1-2-1':[{t:'DEF',x:200,y:475},{t:'MED',x:92,y:425},{t:'MED',x:308,y:425},{t:'DEL',x:200,y:375}],
 '2-1-1':[{t:'DEF',x:105,y:455},{t:'DEF',x:295,y:455},{t:'MED',x:200,y:475},{t:'DEL',x:200,y:372}],
 '1-1-2':[{t:'DEF',x:200,y:475},{t:'MED',x:200,y:375},{t:'DEL',x:92,y:395},{t:'DEL',x:308,y:395}]};
const GKSLOT={x:200,y:578,t:'ARQ'};
const TEAM={A:{name:'Oscuros',frame:'#1b2442',shirt:'#1b2442'},B:{name:'Claros',frame:'#fbf8ee',shirt:'#fbf8ee'}};
const KEY='pas-armador-v2';

let DB={custom:[],matches:[]};
let M=null, opts=[], optIdx=0, pick=null;
const blank=()=>({v:3,sel:[],form:'2-2',A:{gk:null,s:[null,null,null,null],form:'2-2'},B:{gk:null,s:[null,null,null,null],form:'2-2'},det:{}});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){DB.custom=d.custom||[];DB.matches=d.matches||[];M=d.draft||null;}}catch(e){}if(!M)M=blank();fixSel(M);
  if(M.v<3){M.v=3;for(const id in M.det){fixDet(M.det[id]);if(M.det[id].pos==='ARQ')M.det[id].pos='ANY';}}
  M.sel=M.sel.filter(id=>P(id));for(const k of['A','B']){if(M[k].gk&&!P(M[k].gk))M[k].gk=null;M[k].s=M[k].s.map(id=>id&&P(id)?id:null);}}
function fixSel(m){if(!Array.isArray(m.sel))m.sel=['A','B'].flatMap(k=>[m[k].gk,...m[k].s]).filter(Boolean);}
const isSel=id=>M.sel.includes(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify({custom:DB.custom,matches:DB.matches,draft:M}));}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=()=>ROSTER.concat(DB.custom);
const P=id=>all().find(p=>p.id===id);
const rot=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%97;return (h%7)-3;};
let toastT=null;
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),1800);}
const faceImg=p=>p.photo||(p.f?`figus/web/${p.f}-cara.jpg`:null);
function faceThumb(p){const f=faceImg(p);return f?`<img src="${esc(f)}" alt="" loading="lazy" draggable="false">`:`<span class="nof">${p.custom?esc(p.name.slice(0,1).toUpperCase()):'?'}</span>`;}

/* ---------- Estado de la cancha ---------- */
function fixDet(d){if(!d)return d;if(d.pos==='ARQ')d.pos='ANY';for(const[k]of ATTRS)if(typeof d[k]!=='number')d[k]=0;delete d.tr;d.les=!!d.les;return d;}
function consensus(id){const v=VS.players&&VS.players[id];if(!v)return null;const o={};
  if(v.prof)for(const[k]of ATTRS)o[k]=Math.max(-2,Math.min(2,Math.round(v.prof[k]||0)));
  if(v.pos){let b=null,n=0;for(const k in v.pos)if(v.pos[k]>n){n=v.pos[k];b=k;}if(b)o.pos=b;}return o;}
const det=id=>{let d=M.det[id];if(!d)d=M.det[id]={pos:'ANY',vel:0,fis:0,pre:0,res:0,les:false,lvl:'5.5'};fixDet(d);
  const c=consensus(id);if(c)Object.assign(d,c);return d;};
const get=(k,s)=>s<0?M[k].gk:M[k].s[s];
function set(k,s,id){if(s<0)M[k].gk=id;else M[k].s[s]=id;}
function where(id){for(const k of['A','B']){if(M[k].gk===id)return{k,s:-1};const i=M[k].s.indexOf(id);if(i>=0)return{k,s:i};}return null;}
const placed=()=>['A','B'].flatMap(k=>[M[k].gk,...M[k].s]).filter(Boolean);
const members=k=>[M[k].gk,...M[k].s].filter(Boolean);

/* ---------- Valores ocultos ---------- */
/* El promedio de todos (nunca se muestra como puntaje) es lo que usa el armador. Con pocas opiniones se mezcla con el puntaje inicial (pesa como 2). */
function profOf(id){const v=VS.players&&VS.players[id];return v&&v.prof&&v.prof.n?v.prof:null;}
const attrOf=(id,k)=>{const pr=profOf(id);return pr?pr[k]||0:0;};
const starsFromAttrs=a=>(3+(a[0]+a[1]+a[2]+a[3])/4)*2;
function val(id){const p=P(id);if(!p)return 0;if(p.custom)return parseFloat(det(id).lvl||'5.5');const pr=profOf(id);if(!pr)return p.r;
  return (p.r*2+starsFromAttrs([pr.vel,pr.fis,pr.pre,pr.res])*pr.n)/(2+pr.n);}
function teamVal(k){const t=M[k];return (t.gk?val(t.gk):0)+t.s.reduce((a,id)=>a+(id?val(id):0),0);}
function verdictOf(d){return d<=1?['Muy parejo','v1']:d<=2.5?['Parejo','v2']:['Desparejo','v3'];}

/* ---------- Motor de parejos ---------- */
const posOf=id=>{const k=det(id).pos;return ['DEF','MED','DEL'].includes(k)?k:null;};
const fit=(id,t)=>{const p=posOf(id);return !p?1:(p===t?3:0);};
function perms(a){if(a.length<=1)return[a];const o=[];a.forEach((x,i)=>perms(a.filter((_,j)=>j!==i)).forEach(r=>o.push([x,...r])));return o;}
const fm=k=>M[k].form||M.form||'2-2';
function bestSlots(ids,form){const F=FORMS[form];let best=null;for(const pm of perms(ids)){const s=pm.reduce((a,id,i)=>a+fit(id,F[i].t),0);if(!best||s>best.s)best={s,slots:pm};}return best.slots;}
function pickGk(ids){const any=ids.filter(id=>!posOf(id));return [...(any.length?any:ids)].sort((a,b)=>val(a)-val(b))[0];}
function combos(arr,k,s=0,cur=[],out=[]){if(cur.length===k){out.push(cur.slice());return out;}for(let i=s;i<arr.length;i++){cur.push(arr[i]);combos(arr,k,i+1,cur,out);cur.pop();}return out;}
function computeOpts(pl){const first=pl[0],rest=pl.slice(1),hasDef=pl.some(id=>posOf(id)==='DEF'),hasDel=pl.some(id=>posOf(id)==='DEL'),res=[];
  for(const c of combos(rest,4)){const A=[first,...c],B=pl.filter(id=>!A.includes(id));let pen=0,v=[];
    for(const T of[A,B]){const g=pickGk(T),field=T.filter(id=>id!==g);v.push(T.reduce((a,id)=>a+val(id),0));
      if(hasDef&&!field.some(id=>posOf(id)==='DEF'))pen+=1;if(hasDel&&!field.some(id=>posOf(id)==='DEL'))pen+=.6;}
    /* que no quede todo lo rápido (o todo lo fuerte, preciso…) de un mismo lado */
    for(const[k]of ATTRS){const sa=A.reduce((x,id)=>x+attrOf(id,k),0),sb=B.reduce((x,id)=>x+attrOf(id,k),0);pen+=0.4*Math.abs(sa-sb);}
    res.push({A,B,score:Math.abs(v[0]-v[1])*2+pen});}
  return res.sort((a,b)=>a.score-b.score).slice(0,12);}
function applyOpt(o){for(const[k,ids]of[['A',o.A],['B',o.B]]){const g=pickGk(ids);M[k].gk=g;M[k].s=bestSlots(ids.filter(id=>id!==g),fm(k));}}

/* ---------- Cancha (apaisada: Oscuros a la izquierda, Claros a la derecha) ---------- */
const PW=520,PH=420;
const DISPLAY="Anton, Impact, 'Arial Narrow Bold', sans-serif",TYPE="'Courier Prime','Courier New',monospace";
const SHIRT='M-12,-19 L-23,-14 L-30,-3 L-21,3 L-17,-3 L-17,21 L17,21 L17,-3 L21,3 L30,-3 L23,-14 L12,-19 Q0,-10 -12,-19 Z';
function pitchBase(){let s=`<defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r=".8" fill="#000" opacity=".13"/></pattern></defs>`;
  for(let i=0;i<10;i++)s+=`<rect x="${i*52}" y="0" width="52" height="${PH}" fill="${i%2?'#3c8a3a':'#357c34'}"/>`;
  s+=`<rect width="${PW}" height="${PH}" fill="url(#dots)"/>`;
  const L=`<rect x="12" y="12" width="496" height="396"/><line x1="260" y1="12" x2="260" y2="408"/><circle cx="260" cy="210" r="40"/>
   <path d="M12 130 h22 a36 36 0 0 1 36 36 v88 a36 36 0 0 1 -36 36 h-22"/><path d="M508 130 h-22 a36 36 0 0 0 -36 36 v88 a36 36 0 0 0 36 36 h22"/>
   <rect x="4" y="180" width="8" height="60"/><rect x="508" y="180" width="8" height="60"/>`;
  return s+`<g fill="none" stroke="#d6453a" stroke-width="2.4" opacity=".45" transform="translate(1.5 1)">${L}</g><g fill="none" stroke="#f7f1de" stroke-width="2.4" opacity=".92">${L}</g><circle cx="260" cy="210" r="3" fill="#f7f1de"/>`;}
function slotXY(k,s){const sl=s<0?GKSLOT:FORMS[fm(k)][s];const d=(sl.y-320)/320,dx=30+d*222;return{x:k==='A'?260-dx:260+dx,y:40+sl.x/400*340,t:sl.t};}
function slotSVG(k,s){const id=get(k,s),T=TEAM[k],{x,y,t}=slotXY(k,s),hot=pick&&pick.k===k&&pick.s===s?' hot':'';
  const ring=`<rect class="ring" x="-36" y="-42" width="72" height="84" fill="none" stroke="#e2b93b" stroke-width="4" stroke-dasharray="7 4" opacity="0"/>`;
  if(!id)return `<g class="slot${hot}" data-team="${k}" data-slot="${s}"><g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">${ring}
     <rect x="-31" y="-37" width="62" height="74" fill="${k==='A'?'rgba(27,36,66,.35)':'rgba(251,248,238,.2)'}" stroke="#f7f1de" stroke-width="1.6" stroke-dasharray="5 4"/>
     <text x="0" y="6" text-anchor="middle" font-family="${DISPLAY}" font-size="15" fill="#f7f1de" opacity=".85">${t}</text></g></g>`;
  const p=P(id),face=faceImg(p),cid=`c${k}${s}`.replace('-','m'),nm=p.name.toUpperCase(),tl=nm.length*6.4>54?' textLength="54" lengthAdjust="spacingAndGlyphs"':'';
  const photo=face?`<clipPath id="${cid}"><rect x="-27" y="-33" width="54" height="48"/></clipPath><image href="${esc(face)}" x="-27" y="-33" width="54" height="48" preserveAspectRatio="xMidYMid slice" clip-path="url(#${cid})"/>`
    :`<rect x="-27" y="-33" width="54" height="48" fill="#2c3560"/><circle cx="0" cy="-14" r="10" fill="#8d97c4"/><path d="M-21,15 Q-19,-1 0,-1 Q19,-1 21,15 Z" fill="#8d97c4"/><text x="0" y="-9" text-anchor="middle" font-family="${DISPLAY}" font-size="14" fill="#2c3560">?</text>`;
  return `<g class="mk${hot}" data-team="${k}" data-slot="${s}" role="button" aria-label="${esc(p.name)}, remera ${k==='A'?'oscura':'clara'}">
   <g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot(id)})">${ring}
    <rect x="-29" y="-34" width="62" height="74" fill="#000" opacity=".25"/><rect x="-31" y="-37" width="62" height="74" fill="${T.frame}" stroke="#1b2140" stroke-width="1"/>${photo}
    <rect x="-27" y="15" width="54" height="5" fill="#74acdf"/><rect x="-27" y="20" width="54" height="8" fill="#fff"/><rect x="-27" y="28" width="54" height="5" fill="#74acdf"/>
    <text x="0" y="29.5" text-anchor="middle" font-family="${DISPLAY}" font-size="12.5" fill="#1b2140"${tl}>${esc(nm)}</text>
    <g transform="translate(23 -36) scale(.34)"><path d="${SHIRT}" fill="${T.shirt}" stroke="#1b2140" stroke-width="4"/></g></g></g>`;}
function renderPitch(){let s=pitchBase();
  for(const k of['A','B']){s+=slotSVG(k,-1);FORMS[fm(k)].forEach((_,i)=>{s+=slotSVG(k,i);});}
  s+=`<g transform="translate(260 13)" pointer-events="none"><rect x="-46" y="-10" width="92" height="20" fill="#1b2140"/><text y="5.5" text-anchor="middle" font-family="${DISPLAY}" font-size="14" letter-spacing="1" fill="#f7f1de">FÚTBOL PAS</text></g>`;

  s+=`<g transform="translate(430 404) rotate(2)" pointer-events="none"><rect x="-2" y="-15" width="74" height="19" fill="#fbf8ee" stroke="#1b2140"/><text x="35" y="0" text-anchor="middle" font-family="${DISPLAY}" font-size="13" fill="#1b2140">CLAROS</text></g>`;
  if(!placed().length){const c=M.sel.length,t=c<10?`${c}/10 · ELEGÍ ABAJO ↓`:'LISTO: ARMAR PAREJOS ↓',w=t.length*7.4+20;
    s+=`<g class="hint" transform="translate(260 210) rotate(-2)" pointer-events="none"><rect x="${-w/2}" y="-14" width="${w}" height="26" fill="#f7f1de" stroke="#1b2140" stroke-width="1.5"/><text y="5" text-anchor="middle" font-family="${DISPLAY}" font-size="15" fill="#1b2140">${t}</text></g>`;}

const mineOf=id=>ME.prof&&ME.prof[id];

function shownPos(id){const m=mineOf(id);if(m)return{p:POS_S.some(x=>x[0]===m.pos)?m.pos:'ANY',st:'mine'};const c=consensus(id),ok=c&&POS_S.some(x=>x[0]===c.pos);return{p:ok?c.pos:'ANY',st:ok?'avg':'none'};}
function metaOf(p){if(p.custom)return['invitado',''];if(p.id===ME.who)return['sos vos',''];if(mineOf(p.id))return['✓ tu opinión','ok'];
  const pr=profOf(p.id);return[pr?`${pr.n} ${pr.n===1?'opinión':'opiniones'}`:'sin calificar',''];}

    ${cu||me?'':`<div class="sls">${ATTRS.map(([k,full,ab])=>{const s=shown(p.id,k);

/* Elegir / sacar: elegir no lo pone en la cancha; si ya está armada y hay un lugar libre, entra ahí. */
function toggle(id){if(isSel(id)){M.sel.splice(M.sel.indexOf(id),1);const w=where(id);if(w)set(w.k,w.s,null);if(pick&&w&&pick.k===w.k&&pick.s===w.s)pick=null;}
  else{if(M.sel.length>=10){toast('Ya hay 10. Sacá a alguien primero.');return;}M.sel.push(id);
    if(placed().length){const ks=['A','B'].sort((x,y)=>members(x).length-members(y).length);
      for(const k of ks){if(members(k).length>=5)continue;if(!M[k].gk)M[k].gk=id;else M[k].s[M[k].s.indexOf(null)]=id;break;}}}
  opts=[];updateRow(id);commit();}

/* Calificar: lo que movés es tu opinión (secreta) y se guarda sola. */
function setMine(id,patch){ME.prof=ME.prof||{};let m=ME.prof[id];
  if(!m){m={};for(const[k]of ATTRS)m[k]=Math.max(-2,Math.min(2,Math.round(shown(id,k).v)-3));m.pos=shownPos(id).p;ME.prof[id]=m;}
  else if(Object.keys(patch).every(k=>m[k]===patch[k]))return;

rows.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-sl]');if(!el||e.button>0)return;SL={el,x:e.clientX,y:e.clientY,act:false,pid:e.pointerId};

  if(!SL.act){if(Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)){SL.act=true;try{SL.el.setPointerCapture(e.pointerId);}catch(_){}}else if(Math.abs(dy)>10){SL=null;if(listDirty)renderList();return;}else return;}
  e.preventDefault();slSet(SL.el,e.clientX);});

/* ---------- Compartir imagen ---------- */
const toDataURL=url=>fetch(url).then(r=>r.blob()).then(b=>new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(b);}));
let imgBlob=null;
async function pitchPng(){const svg=$('pitch').cloneNode(true);svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
  svg.querySelectorAll('.slot,.ring,.hint').forEach(g=>g.remove());
  for(const im of svg.querySelectorAll('image')){const h=im.getAttribute('href');if(h&&!h.startsWith('data:')){try{im.setAttribute('href',await toDataURL(h));}catch(e){}}}
  const SW=PW*2,SH=PH*2;svg.setAttribute('width',SW);svg.setAttribute('height',SH);
  const img=new Image();await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg));});
  const c=document.createElement('canvas');c.width=SW+40;c.height=SH+170;const g=c.getContext('2d');
  g.fillStyle='#efe5cc';g.fillRect(0,0,c.width,c.height);g.fillStyle='#1b2140';g.fillRect(14,14,SW+12,SH+12);g.drawImage(img,20,20,SW,SH);
  const a=teamVal('A'),b=teamVal('B'),pa=Math.round(a/(a+b)*100),[lab]=verdictOf(Math.abs(a-b));
  const bx=20,by=SH+48,bw=SW,bh=50,wa=Math.round(bw*pa/100);g.fillStyle='#1b2442';g.fillRect(bx,by,wa,bh);g.fillStyle='#fbf8ee';g.fillRect(bx+wa,by,bw-wa,bh);
  g.strokeStyle='#1b2140';g.lineWidth=3;g.strokeRect(bx,by,bw,bh);g.fillStyle='#e2b93b';g.fillRect(bx+bw/2-2,by-5,4,bh+10);
  g.textBaseline='middle';g.font='28px Anton, Impact, sans-serif';g.textAlign='left';g.fillStyle='#f7f1de';g.fillText(`OSCUROS ${pa}%`,bx+14,by+bh/2+1);
  g.textAlign='right';g.fillStyle='#1b2140';g.fillText(`${100-pa}% CLAROS`,bx+bw-14,by+bh/2+1);
  const t=lab.toUpperCase();g.font='bold 30px "Courier Prime","Courier New",monospace';const w=g.measureText(t).width+40;
  g.save();g.translate(c.width/2,by+bh+42);g.rotate(-.03);g.strokeStyle='#1b2140';g.lineWidth=4;g.strokeRect(-w/2,-25,w,50);g.fillStyle='#1b2140';g.textAlign='center';g.fillText(t,0,2);g.restore();
  return new Promise((ok,ko)=>c.toBlob(bl=>bl?ok(bl):ko(),'image/png'));}
$('btnImg').onclick=async()=>{if(placed().length<10)return;try{imgBlob=await pitchPng();$('imgOut').src=URL.createObjectURL(imgBlob);

/* ---------- Calificaciones (secretas, por dispositivo) ---------- */
const VOTE_URL='https://script.google.com/macros/s/AKfycbzELKhJomhoqm93U8o7ueskgDl-ikr8EzPYUgSbEZb4RCgQUU5z5gg0BPFebgbnJ9JR/exec';
const VK='pas-votos-v1';
let VS={players:{},voters:0},ME={id:null,who:'',sent:false};
function vload(){try{const d=JSON.parse(localStorage.getItem(VK)||'null');if(d){ME=Object.assign(ME,d.me||{});VS=d.vs||VS;}}catch(e){}
  if(ME.who==null)ME.who='';delete ME.notes;delete ME.stars;delete ME.pos;
  if(!ME.id){ME.id=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');vsave();}}
function vsave(){try{localStorage.setItem(VK,JSON.stringify({me:ME,vs:VS}));}catch(e){}}
function refresh(){renderTop();renderList();}
async function fetchVotes(){if(!VOTE_URL)return;try{const r=await fetch(VOTE_URL);const d=await r.json();if(d&&d.players){VS=d;vsave();refresh();}}catch(e){}}
/* Guardado automático: se manda sola unos segundos después; si no hay señal, queda pendiente y se reintenta. */
let syncTimer=null,syncing=false,syncFails=0,syncState='';
function scheduleSync(ms){clearTimeout(syncTimer);syncTimer=setTimeout(syncVotes,ms);}
async function syncVotes(){if(!VOTE_URL||!ME.pending)return;if(syncing){scheduleSync(1200);return;}
  const votes={},profile={};if(ME.pDirty)for(const k in ME.prof||{})if(k!==ME.who&&P(k)&&!P(k).custom)profile[k]=ME.prof[k];
  if(!Object.keys(profile).length){ME.pending=false;vsave();syncUI();return;}
  syncing=true;syncState='saving';syncUI();
  try{const r=await fetch(VOTE_URL,{method:'POST',body:JSON.stringify({voter:ME.id,who:ME.who||'',votes,profile})});const d=await r.json();
    if(d&&d.players){VS=d;refresh();}ME.pDirty=false;ME.sent=true;ME.pending=false;syncFails=0;syncState='ok';vsave();}
  catch(e){syncFails++;syncState='retry';scheduleSync(Math.min(60000,4000*syncFails));}
  finally{syncing=false;syncUI();}}
window.addEventListener('online',()=>{if(ME.pending)scheduleSync(500);});
function syncUI(){const el=$('sync');
  if(syncState==='retry'){el.textContent='sin señal, reintenta';el.className='sync err';}
  else if(ME.pending||syncState==='saving'){el.textContent='guardando…';el.className='sync wait';}
  else if(syncState==='ok'){el.textContent='✓ guardado';el.className='sync';}
  else{el.textContent='';el.className='sync';}}

load();vload();renderTop();renderList();fetchVotes();if(ME.pending)scheduleSync(2000);setInterval(()=>{if(!document.hidden)fetchVotes();},60000);
</script>
