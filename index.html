<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta property="og:type" content="website"><meta property="og:site_name" content="Fútbol PAS"><meta property="og:title" content="Fútbol PAS"><meta property="og:description" content="Votá a cada jugador y armá equipos parejos."><meta property="og:url" content="https://futbolpas.pages.dev/"><meta property="og:image" content="https://futbolpas.pages.dev/og.jpg?v=3"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="description" content="Votá a cada jugador y armá equipos parejos."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Fútbol PAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&family=Inter:wght@400;600;700&display=swap">
<style>
/* Mobile-first: arriba la cancha fija (equipos + balance + acciones), abajo la lista de jugadores que scrollea sola. */
:root{
  --paper:#efe5cc; --paper-2:#e6d9b8; --card:#fbf6e6; --ink:#1b2140; --ink-soft:#4a4a5e; --celeste:#74acdf; --red:#d6453a; --mustard:#e2b93b;
  --chalk:#f7f1de; --navy-shirt:#1b2442; --white-shirt:#fbf8ee; --ok:#2f7f49; --ok-bg:#e3efd9;
  --display:Anton,Impact,"Arial Narrow Bold","Arial Narrow",sans-serif; --type:"Courier Prime","Courier New",monospace; --body:Inter,system-ui,"Segoe UI",sans-serif;
  color-scheme:light; padding:0!important;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{overflow:hidden;overscroll-behavior:none}
body{margin:0;height:100dvh;overflow:hidden;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.3;background:var(--paper);
  background-image:radial-gradient(rgba(27,33,64,.07) 1px,transparent 1.2px);background-size:6px 6px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,select,input{font:inherit;color:inherit}
.app{height:100%;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
/* ---- arriba ---- */
.top{flex:0 0 auto;height:50vh;height:50dvh;min-height:290px;max-height:600px;touch-action:pinch-zoom;display:flex;flex-direction:column;gap:6px;padding:6px 10px 8px;background:var(--paper-2);border-bottom:3px solid var(--ink)}
.pitch{position:relative;flex:1 1 auto;min-height:0}
.pitch svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.mk,.slot{cursor:pointer}
.mk.hot .ring,.slot.hot .ring{opacity:1}
.bal{display:flex;align-items:center;gap:8px}
.track{position:relative;flex:1;height:22px;display:flex;border:2px solid var(--ink);overflow:hidden;background:var(--white-shirt)}
.track i{display:flex;align-items:center;font-style:normal;font-family:var(--display);font-size:12.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;transition:width .4s cubic-bezier(.3,1.3,.5,1)}
.track .a{background:var(--navy-shirt);color:var(--chalk);padding-left:6px}
.track .b{background:var(--white-shirt);justify-content:flex-end;padding-right:6px}
.track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:3px;margin-left:-1.5px;background:var(--mustard)}
.verd{flex:none;min-width:74px;text-align:center;font-family:var(--type);font-weight:700;font-size:11.5px;text-transform:uppercase;border:2px solid currentColor;padding:1px 5px;transform:rotate(-2deg);color:var(--ink-soft)}
.verd.v1{color:var(--ok)}.verd.v2{color:#9a7410}.verd.v3{color:var(--red)}
.acts{display:flex;gap:5px}
.btn{height:44px;min-width:42px;display:inline-grid;place-items:center;font-family:var(--display);font-size:14.5px;letter-spacing:.02em;text-transform:uppercase;border:2.5px solid var(--ink);border-radius:6px;
  background:var(--chalk);padding:0 8px;cursor:pointer;box-shadow:2px 2px 0 var(--red);transition:transform .08s;white-space:nowrap}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 var(--red)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.primary{flex:1;background:var(--mustard)}
@media (max-width:390px){.acts{gap:4px}.btn{font-size:13px;padding:0 6px;letter-spacing:.01em}}
.btn:focus-visible,.face:focus-visible,.sl:focus-visible,.pos button:focus-visible,select:focus-visible,input:focus-visible{outline:3px dashed var(--red);outline-offset:2px}
/* ---- abajo ---- */
.list{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 10px calc(20px + env(safe-area-inset-bottom,0px))}
.lhead{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 0 7px;background:var(--paper);border-bottom:2px solid var(--ink)}
.lhead b{white-space:nowrap;font-family:var(--display);font-weight:400;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.cnt{display:inline-block;background:var(--ink);color:var(--mustard);padding:0 6px;margin-left:2px}
.cnt.full{background:var(--ok);color:#fff}
.sync{font-size:11px;font-weight:600;color:var(--ok);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:right;white-space:nowrap}
.sync.wait{color:var(--ink-soft)}.sync.err{color:var(--red)}
.soy{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.soy select{height:36px;max-width:104px;border:1.5px solid var(--ink);border-radius:5px;background:#fff;font-size:13px;padding:0 4px}
.tipbox{display:flex;align-items:center;gap:8px;margin:8px 0 2px;padding:6px 8px 6px 10px;border-radius:6px;background:var(--ink);color:var(--chalk);font-size:13px;line-height:1.35}
.tipbox span{flex:1}.tipbox b{color:var(--mustard)}
.tipbox button{flex:none;width:32px;height:32px;margin:-4px -4px -4px 0;border:0;background:none;color:var(--chalk);font-size:16px;cursor:pointer}
.rows{display:flex;flex-direction:column;position:relative;z-index:0;isolation:isolate}
.row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:start;padding:6px 4px 5px 2px;border-bottom:1px solid rgba(27,33,64,.13);border-left:4px solid transparent}
.row.on{background:var(--ok-bg);border-left-color:var(--ok)}
.face{position:relative;width:72px;height:85px;padding:0;border:2px solid var(--ink);border-radius:4px;background:#fff;cursor:pointer;overflow:visible;box-shadow:2px 2px 0 rgba(27,33,64,.25);transform:rotate(-1.5deg)}
.row:nth-child(even) .face{transform:rotate(1.5deg)}
.row:not(.vot) .face{width:52px;height:62px}
.face img,.face .nof{width:100%;height:100%;object-fit:cover;object-position:top;display:block;border-radius:2px}
.face .nof{display:grid;place-items:center;background:#25305a;color:#8d97c4;font-family:var(--display);font-size:24px}
.row:not(.on) .face{filter:grayscale(.35);opacity:.9}
.face .ck{position:absolute;right:-7px;bottom:-7px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid var(--ink);background:#fff;color:transparent}
.row.on .face .ck{background:var(--ok);color:#fff;border-color:#fff;box-shadow:0 0 0 1.5px var(--ok)}
.rm{min-width:0;display:flex;flex-direction:column;gap:3px}
.rt{display:flex;align-items:center;gap:6px;min-width:0}
.nm{flex:1;min-width:0;min-height:40px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0;border:0;background:none;cursor:pointer;text-align:left}
.vot .nm{min-height:0;flex-direction:row;align-items:baseline;justify-content:space-between;gap:6px}
.nm span{font-family:var(--display);font-size:17px;text-transform:uppercase;line-height:1.05;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{font-size:11px;color:var(--ink-soft);white-space:nowrap}.nm small:empty{display:none}.nm small.ok{color:var(--ok);font-weight:600}
.row.on .nm span{color:#22592f}
.cl{font-size:9.5px;line-height:1;margin-top:2px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.ctl{display:flex;flex-direction:column;gap:2px}
.ctl.off{opacity:.5;filter:grayscale(1)}.ctl.off .sl,.ctl.off .pos button{cursor:default}
.pos{display:flex;margin:0 0 2px}
.pos button{flex:1 1 auto;height:32px;min-width:0;padding:0 2px;font-size:10.5px;letter-spacing:-.01em;font-weight:600;border:1.5px solid var(--ink);margin-left:-1.5px;background:#fff;cursor:pointer;white-space:nowrap}
.pos button:first-child{margin-left:0;border-radius:6px 0 0 6px}.pos button:last-child{border-radius:0 6px 6px 0}
.pos button[aria-pressed="true"].mine{background:var(--ink);color:#fff}
.pos button[aria-pressed="true"].avg{background:var(--celeste);color:var(--ink)}
.pos button[aria-pressed="true"].none{background:var(--paper-2)}
.sls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
/* barrita: pista gruesa redondeada + perilla grande; touch-action pan-y = el scroll vertical sigue siendo de la lista */
.sl{display:flex;flex-direction:column;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;--th:24px}
.sl .lb{display:flex;justify-content:space-between;font-size:12px;line-height:1.1;font-weight:600;color:var(--ink-soft)}
.sl .lb b{font-size:10.5px;color:var(--ink);min-width:1ch;text-align:right;white-space:nowrap}
.sl .tr{position:relative;height:34px;margin-top:2px}
.sl .tr::before{content:"";position:absolute;left:calc(var(--th)/2);right:calc(var(--th)/2);top:50%;height:8px;margin-top:-4px;border-radius:4px;background:rgba(27,33,64,.16)}
.sl .tr i{position:absolute;left:calc(var(--th)/2);right:calc(var(--th)/2);top:50%;height:10px;margin-top:-5px;border-radius:5px;background:linear-gradient(90deg,#f2c94c,#3fae5a);clip-path:inset(0 calc((1 - var(--a))*100%) 0 0 round 4px);transition:clip-path .4s}
.sl.mine .tr::after{display:none;content:"";position:absolute;z-index:1;left:calc(var(--th)/2);right:calc(var(--th)/2);top:50%;height:8px;margin-top:-4px;border-radius:4px;background:linear-gradient(90deg,#f2c94c,#3fae5a);clip-path:inset(0 calc((1 - var(--t))*100%) 0 0 round 4px)}
.sl.mine:not(.drag) .tr::after{transition:clip-path .12s}
.sl .tr s{position:absolute;z-index:5;top:calc(50% - 17px);left:calc(var(--th)/2 + (100% - var(--th))*var(--a));width:0;height:0;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--ink);filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff);transition:left .4s;pointer-events:none}
.sl.noavg .tr i,.sl.noavg .tr s{display:none}
.sl .tr u{position:absolute;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(27,33,64,.45)}
.sl .tr u:nth-of-type(1){left:calc(var(--th)/2)}.sl .tr u:nth-of-type(2){left:calc(var(--th)/2 + (100% - var(--th))*.25)}.sl .tr u:nth-of-type(3){left:50%}
.sl .tr u:nth-of-type(4){left:calc(var(--th)/2 + (100% - var(--th))*.75)}.sl .tr u:nth-of-type(5){left:calc(100% - var(--th)/2)}
.sl .tr em{position:absolute;top:50%;left:calc(var(--th)/2 + (100% - var(--th))*var(--t));width:var(--th);height:var(--th);margin:calc(var(--th)/-2) 0 0 calc(var(--th)/-2);border-radius:50%;transition:transform .12s,left .12s;
  background:rgba(255,255,255,.55);border:2px dashed rgba(27,33,64,.55)}
.sl .tr em{z-index:3;display:grid;place-items:center;font:700 12px/1 var(--body);color:#fff}
.sl.mine .tr em{background:hsl(var(--hue,90) 60% 36%);border:2px solid #fff;box-shadow:0 0 0 2px hsl(var(--hue,90) 60% 26%),0 2px 5px rgba(0,0,0,.3);transition:transform .12s,left .12s,background-color .15s}
.sl .lb b{font-size:13px;font-weight:800;color:#24702f}.sl .lb b:not(:empty)::before{content:"grupo ";font-size:10px;font-weight:500;color:var(--ink-soft)}
.sl.drag .tr em{box-shadow:0 0 0 2px hsl(var(--hue,90) 60% 26%),0 0 0 9px hsl(var(--hue,90) 70% 45% / .22),0 3px 8px rgba(0,0,0,.3)}
@keyframes sltick{0%{transform:scale(1.3)}45%{transform:scale(1.6)}100%{transform:scale(1.3)}}
.sl.drag.tick .tr em{animation:sltick .2s ease-out}
@keyframes slset{0%{transform:scale(1.3)}45%{transform:scale(.85)}75%{transform:scale(1.1)}100%{transform:scale(1)}}
.sl.set .tr em{animation:slset .35s ease-out}
@keyframes rowvoted{0%{background-color:hsl(90 55% 80% / .55)}100%{background-color:transparent}}
.row.voted:not(.on){animation:rowvoted .7s ease-out}
.nm small.ok{transition:color .2s}
.sl .tr b{position:absolute;bottom:calc(50% + var(--th)/2 + 4px);left:calc(var(--th)/2 + (100% - var(--th))*var(--t));transform:translateX(calc(var(--t)*-100%));z-index:4;white-space:nowrap;background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .15s}
.sl.drag .tr b,.sl.show .tr b{opacity:1}
.sl.drag .tr em{transform:scale(1.3);transition:transform .12s}


.ctl.off .tr em,.ctl.off .tr i,.ctl.off .tr s,.ctl.off .tr b{display:none}
.addf{display:flex;gap:6px;margin-top:12px}
.addf input{flex:1;min-width:0;height:42px;border:2px solid var(--ink);border-radius:5px;background:#fff;padding:0 10px;font-size:16px}
.rmv{width:40px;height:40px;border-radius:5px;border:1.5px solid var(--ink);background:#fff;cursor:pointer;flex:none}
@media (max-width:359px){.row{grid-template-columns:56px minmax(0,1fr);gap:7px}.row .face{width:56px;height:66px}.pos button{font-size:9.5px;padding:0 1px;letter-spacing:-.02em}}
/* ---- compu / apaisado: lado a lado ---- */
@media (min-width:860px),(orientation:landscape) and (min-width:560px) and (max-height:560px){
  .app{flex-direction:row}
  .top{height:100%;max-height:none;min-height:0;width:56%;border-bottom:0;border-right:3px solid var(--ink);padding:12px;justify-content:center;gap:10px}
  .pitch{flex:0 1 auto;width:100%;aspect-ratio:520/420}
  .list{padding-inline:14px}
}
dialog{border:3px solid var(--ink);background:var(--paper);color:var(--ink);padding:14px;width:min(440px,calc(100vw - 24px));box-shadow:6px 6px 0 var(--red)}
dialog::backdrop{background:rgba(20,18,10,.55)}
dialog h2{font-family:var(--display);font-weight:400;font-size:24px;text-transform:uppercase;margin:0 0 10px;line-height:1}
.dbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.frow{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-family:var(--type);font-size:12px;font-weight:700;text-transform:uppercase}
.seg{display:flex}
.seg button{flex:1;height:40px;font-family:var(--type);font-weight:700;font-size:13px;border:2px solid var(--ink);margin-left:-2px;background:#fff;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--mustard)}
#imgOut{display:block;max-width:100%;max-height:calc(100dvh - 170px);margin:0 auto;border:2px solid var(--ink)}
dialog .dbar .btn.primary{flex:1}
/* formación de cada equipo, sobre su mitad de la cancha */
.fsel{position:absolute;bottom:var(--fy,0px);z-index:2;display:flex;align-items:center;height:36px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;font-family:var(--display);font-size:14px;letter-spacing:.02em;text-transform:uppercase;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.clr{position:absolute;z-index:3;top:var(--fy,0px);right:var(--fx,0px);width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--chalk);color:var(--ink);font-size:16px;font-weight:700;line-height:1;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.clr:active{transform:translate(2px,2px);box-shadow:none}
.fsel.a{left:var(--fx,0px);background:var(--navy-shirt);color:var(--chalk)}
.fsel.b{right:var(--fx,0px);background:var(--white-shirt);color:var(--ink)}
.fsel span{padding:0 2px 0 8px;pointer-events:none}
.fsel select{height:100%;border:0;background:transparent;color:inherit;font:inherit;padding:0 20px 0 4px;cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:right 10px top 16px,right 5px top 16px;background-size:5px 5px;background-repeat:no-repeat}
.fsel select option{color:#1b2140;background:#fff}
.fsel:focus-within{outline:3px dashed var(--red);outline-offset:2px}
.hint{font-family:var(--type);font-size:12px;color:var(--ink-soft);margin:8px 0 0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--mustard);
  padding:8px 14px;font-family:var(--type);font-weight:700;font-size:13px;border:2px solid var(--mustard);z-index:60;max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.track i,.sl .tr i,.btn{transition:none}}
</style>

<div class="app">
  <section class="top" aria-label="Cancha">
    <div class="pitch"><svg id="pitch" viewBox="0 0 520 420" role="img" aria-label="Cancha con los dos equipos"></svg>
      <button type="button" class="clr" id="btnClr" aria-label="Limpiar cancha" title="Limpiar cancha" hidden>✕</button>
      <label class="fsel a"><span>Oscuros</span><select id="formA" aria-label="Formación de Oscuros"></select></label>
      <label class="fsel b"><span>Claros</span><select id="formB" aria-label="Formación de Claros"></select></label></div>
    <div class="bal" aria-live="polite"><div class="track"><i class="a" id="barA"></i><i class="b" id="barB"></i></div><span class="verd" id="verd">—</span></div>
    <div class="acts">
      <button class="btn primary" id="btnAuto" type="button">⚖️ Armar parejos</button>
      <button class="btn" id="btnOther" type="button">🔄 Otra opción</button>
      <button class="btn" id="btnImg" type="button">📤 Compartir</button>
    </div>
  </section>
  <section class="list" id="list" aria-label="Jugadores">
    <div class="lhead"><b>Jugadores <span class="cnt" id="cnt">0/10</span></b><span class="sync" id="sync"></span>
      <label class="soy">Soy <select id="soy"></select></label></div>
    <div class="tipbox" id="tip" hidden><span id="tipT"></span><button type="button" id="tipX" aria-label="Cerrar">✕</button></div>
    <div class="rows" id="rows"></div>
    <form class="addf" id="addFrm"><input id="aName" maxlength="20" placeholder="Invitado sin figurita" aria-label="Nombre del invitado"><button class="btn" type="submit">+ Sumar</button></form>
  </section>
</div>

<dialog id="imgDlg">
  <img id="imgOut" alt="Cancha con los equipos">
  <p class="hint">Mantené apretada la imagen para guardarla.</p>
  <div class="dbar"><button class="btn primary" type="button" id="imgShare" hidden>📤 Enviar</button><button class="btn" type="button" id="imgCopy">Copiar</button><button class="btn" type="button" onclick="this.closest('dialog').close()">Cerrar</button></div>
</dialog>

<script>
/* VOTACIÓN: en false no se lee, muestra ni manda ninguna calificación (todo vacío; el armador usa solo los puntajes base).
   Poner en true cuando arranque la votación. */
const VOTACION_ABIERTA=true;
/* RESET: cambiar este valor borra, una sola vez en cada teléfono, todos los datos guardados (votos, selección, equipos, invitados, avisos). */
const RESET_ID='2026-11-26b';
try{if(localStorage.getItem('pas-reset')!==RESET_ID){['pas-votos-v1','pas-armador-v2','pas-tip-v3','pas-tip-v4','pas-tip-v4c'].forEach(k=>localStorage.removeItem(k));localStorage.setItem('pas-reset',RESET_ID);}}catch(e){}
/* Plantel base. Los puntajes son internos: nunca se muestran. */
const ROSTER=[
 {id:'r1',name:'Elias',r:6,f:'elias'},{id:'r2',name:'Lauti',r:7.5,f:'lauti'},{id:'r3',name:'Colo',r:4,f:'colo'},
 {id:'r4',name:'Charly',r:5,f:'charly'},{id:'r5',name:'Fede Carlini',r:7.5,f:'fede-carlini'},{id:'r6',name:'Nico',r:7.5,gkr:7.5,f:'nico'},
 {id:'r7',name:'Hermano Pedro',r:6.5,f:'hermano-pedro'},{id:'r8',name:'Pedro',r:6,gkr:6,f:'pedro'},{id:'r9',name:'Fede Codino',r:8,f:'fede-codino'},
 {id:'r10',name:'Nacho',r:7.5,f:'nacho'},{id:'r11',name:'Gustavo 4to',r:6.5,f:null,mystery:'REFUERZO MISTERIOSO'},
 {id:'r12',name:'Pato Wall',r:6,f:'pato-wall'},{id:'r13',name:'Martín',r:6,f:'martin'},
 {id:'r14',name:'Fede Bianchini',r:6,f:'fede-bianchini'},{id:'r15',name:'JP',r:6,f:'jp'},
 {id:'r16',name:'Mauro',r:6,f:'mauro'}];
const POS_S=[['ANY','Cualquiera'],['ARQ','Arquero'],['DEF','Defensa'],['MED','Medio'],['DEL','Delantero']];
/* Cada rasgo va de -2 a +2 (en pantalla 1..5). */
const ATTRS=[['vel','Ataque'],['res','Defensa'],['pre','Técnica'],['fis','Físico']];
const KI={vel:0,fis:1,pre:2,res:3};
const hasAvg=(pr,k)=>!!pr&&typeof pr[k]==='number'&&(!pr.k||pr.k[KI[k]]>0);
const FORMS={
 '2-2':[{t:'DEF',x:112,y:472,l:'Defensor izq.'},{t:'DEF',x:288,y:472,l:'Defensor der.'},{t:'DEL',x:112,y:366,l:'Delantero izq.'},{t:'DEL',x:288,y:366,l:'Delantero der.'}],
 '1-2-1':[{t:'DEF',x:200,y:475,l:'Último hombre'},{t:'MED',x:92,y:425,l:'Volante izq.'},{t:'MED',x:308,y:425,l:'Volante der.'},{t:'DEL',x:200,y:375,l:'Delantero'}],
 '2-1-1':[{t:'DEF',x:105,y:455,l:'Defensor izq.'},{t:'DEF',x:295,y:455,l:'Defensor der.'},{t:'MED',x:200,y:475,l:'Volante central'},{t:'DEL',x:200,y:372,l:'Delantero'}],
 '1-1-2':[{t:'DEF',x:200,y:475,l:'Último hombre'},{t:'MED',x:200,y:375,l:'Volante central'},{t:'DEL',x:92,y:395,l:'Delantero izq.'},{t:'DEL',x:308,y:395,l:'Delantero der.'}]};
const GKSLOT={x:200,y:578,t:'ARQ',l:'Arquero'};
const TEAM={A:{name:'Oscuros',frame:'#1b2442',shirt:'#1b2442'},B:{name:'Claros',frame:'#fbf8ee',shirt:'#fbf8ee'}};
const KEY='pas-armador-v2';

let DB={custom:[],matches:[]};
let M=null, opts=[], optIdx=0, pick=null;
const blank=()=>({v:3,sel:[],form:'2-2',A:{gk:null,s:[null,null,null,null],form:'2-2'},B:{gk:null,s:[null,null,null,null],form:'2-2'},det:{}});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){DB.custom=d.custom||[];DB.matches=d.matches||[];M=d.draft||null;}}catch(e){}if(!M)M=blank();fixSel(M);
  if(M.v<3){M.v=3;for(const id in M.det){fixDet(M.det[id]);if(M.det[id].pos==='ARQ')M.det[id].pos='ANY';}}
  M.sel=M.sel.filter(id=>P(id));for(const k of['A','B']){if(M[k].gk&&!P(M[k].gk))M[k].gk=null;M[k].s=M[k].s.map(id=>id&&P(id)?id:null);}}
function fixSel(m){if(!Array.isArray(m.sel))m.sel=['A','B'].flatMap(k=>[m[k].gk,...m[k].s]).filter(Boolean);}
const isSel=id=>M.sel.includes(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify({custom:DB.custom,matches:DB.matches,draft:M}));}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=()=>ROSTER.concat(DB.custom);
const P=id=>all().find(p=>p.id===id);
const rot=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%97;return (h%7)-3;};
let toastT=null;
function toast(t,ms=1800){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),ms);}
const faceImg=p=>p.photo||(p.f?`figus/web/${p.f}-cara.jpg`:null);
const cardImg=p=>p.photo||(p.f?`figus/web/${p.f}-mini.jpg`:null);
function cardThumb(p){const f=cardImg(p);return f?`<img src="${esc(f)}" alt="" loading="lazy" draggable="false">`:`<span class="nof">${p.custom?esc(p.name.slice(0,1).toUpperCase()):'?'}</span>`;}
function faceThumb(p){const f=faceImg(p);return f?`<img src="${esc(f)}" alt="" loading="lazy" draggable="false">`:`<span class="nof">${p.custom?esc(p.name.slice(0,1).toUpperCase()):'?'}</span>`;}

/* ---------- Estado de la cancha ---------- */
function fixDet(d){if(!d)return d;for(const[k]of ATTRS)if(typeof d[k]!=='number')d[k]=0;delete d.tr;d.les=!!d.les;return d;}
function consensus(id){if(!VOTACION_ABIERTA)return null;const v=VS.players&&VS.players[id];if(!v)return null;const o={};
  if(v.prof)for(const[k]of ATTRS)o[k]=Math.max(-2,Math.min(2,Math.round(v.prof[k]||0)));
  if(v.pos){let b=null,n=0;for(const k in v.pos)if(v.pos[k]>n){n=v.pos[k];b=k;}if(b)o.pos=b;}return o;}
const det=id=>{let d=M.det[id];if(!d)d=M.det[id]={pos:'ANY',vel:0,fis:0,pre:0,res:0,les:false,lvl:'5.5'};fixDet(d);
  const c=consensus(id);if(c)Object.assign(d,c);return d;};
const get=(k,s)=>s<0?M[k].gk:M[k].s[s];
function set(k,s,id){if(s<0)M[k].gk=id;else M[k].s[s]=id;}
function where(id){for(const k of['A','B']){if(M[k].gk===id)return{k,s:-1};const i=M[k].s.indexOf(id);if(i>=0)return{k,s:i};}return null;}
const placed=()=>['A','B'].flatMap(k=>[M[k].gk,...M[k].s]).filter(Boolean);
const members=k=>[M[k].gk,...M[k].s].filter(Boolean);

/* ---------- Valores ocultos ---------- */
/* El promedio de todos (nunca se muestra como puntaje) es lo que usa el armador. Con pocas opiniones se mezcla con el puntaje inicial (pesa como 2). */
function profOf(id){if(!VOTACION_ABIERTA)return null;const v=VS.players&&VS.players[id];return v&&v.prof&&v.prof.n?v.prof:null;}
const attrN=(pr,k)=>!pr?0:pr.k?(pr.k[KI[k]]||0):pr.n;
const attrOf=(id,k)=>{const pr=profOf(id),c=attrN(pr,k);return c?(pr[k]||0)*c/(c+1):0;};
const starsFromAttrs=a=>(3+(a[0]+a[1]+a[2]+a[3])/4)*2;
function val(id){const p=P(id);if(!p)return 0;if(p.custom)return parseFloat(det(id).lvl||'5.5');const pr=profOf(id);if(!pr)return p.r;
  const w=ATTRS.reduce((a,[k])=>a+attrN(pr,k),0)/4;if(!w)return p.r;
  const lvl=(3+ATTRS.reduce((a,[k])=>a+(pr[k]||0)*(attrN(pr,k)?1:0),0)/Math.max(1,ATTRS.filter(([k])=>attrN(pr,k)).length))*2;
  return (p.r+lvl*w)/(1+w);}
function teamVal(k){const t=M[k];return (t.gk?val(t.gk):0)+t.s.reduce((a,id)=>a+(id?val(id):0),0);}
function verdictOf(d){return d<=1?['Muy parejo','v1']:d<=2.5?['Parejo','v2']:['Desparejo','v3'];}

/* ---------- Motor de parejos ---------- */
const posOf=id=>{if(!VOTACION_ABIERTA)return null;const k=det(id).pos;return ['ARQ','DEF','MED','DEL'].includes(k)?k:null;};
const fit=(id,t)=>{const p=posOf(id);return !p?1:(p===t?3:0);};
function perms(a){if(a.length<=1)return[a];const o=[];a.forEach((x,i)=>perms(a.filter((_,j)=>j!==i)).forEach(r=>o.push([x,...r])));return o;}
const fm=k=>M[k].form||M.form||'2-2';
function bestSlots(ids,form){const F=FORMS[form];let best=null;for(const pm of perms(ids)){const s=pm.reduce((a,id,i)=>a+fit(id,F[i].t),0);if(!best||s>best.s)best={s,slots:pm};}return best.slots;}
function pickGk(ids,r=0){const arq=ids.filter(id=>posOf(id)==='ARQ');const c=arq.length?arq:(ids.filter(id=>!posOf(id)).length?ids.filter(id=>!posOf(id)):ids);
  const o=[...c].sort((a,b)=>val(a)-val(b)||(a<b?-1:1));return o[r%o.length];}
function combos(arr,k,s=0,cur=[],out=[]){if(cur.length===k){out.push(cur.slice());return out;}for(let i=s;i<arr.length;i++){cur.push(arr[i]);combos(arr,k,i+1,cur,out);cur.pop();}return out;}
function computeOpts(pl){const first=pl[0],rest=pl.slice(1),hasDef=pl.some(id=>posOf(id)==='DEF'),hasDel=pl.some(id=>posOf(id)==='DEL'),nArq=pl.filter(id=>posOf(id)==='ARQ').length,res=[];
  for(const c of combos(rest,4)){const A=[first,...c],B=pl.filter(id=>!A.includes(id));let pen=0,v=[];
    for(const T of[A,B]){const g=pickGk(T),field=T.filter(id=>id!==g);v.push(T.reduce((a,id)=>a+val(id),0));
      if(nArq>=2&&!T.some(id=>posOf(id)==='ARQ'))pen+=1.5;if(hasDef&&!field.some(id=>posOf(id)==='DEF'))pen+=1;if(hasDel&&!field.some(id=>posOf(id)==='DEL'))pen+=.6;}
    /* que no quede todo lo rápido (o todo lo fuerte, preciso…) de un mismo lado */
    for(const[k]of ATTRS){const sa=A.reduce((x,id)=>x+attrOf(id,k),0),sb=B.reduce((x,id)=>x+attrOf(id,k),0);pen+=0.6*Math.abs(sa-sb);}
    res.push({A,B,score:Math.abs(v[0]-v[1])*2+pen});}
  return res.sort((a,b)=>a.score-b.score).slice(0,12);}
function applyOpt(o){for(const[k,ids]of[['A',o.A],['B',o.B]]){const g=pickGk(ids,optIdx);M[k].gk=g;M[k].s=bestSlots(ids.filter(id=>id!==g),fm(k));}}

/* ---------- Cancha (apaisada: Oscuros a la izquierda, Claros a la derecha) ---------- */
const PW=520,PH=420;
const DISPLAY="Anton, Impact, 'Arial Narrow Bold', sans-serif",TYPE="'Courier Prime','Courier New',monospace";
const SHIRT='M-12,-19 L-23,-14 L-30,-3 L-21,3 L-17,-3 L-17,21 L17,21 L17,-3 L21,3 L30,-3 L23,-14 L12,-19 Q0,-10 -12,-19 Z';
function pitchBase(){let s=`<defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r=".8" fill="#000" opacity=".13"/></pattern></defs>`;
  for(let i=0;i<10;i++)s+=`<rect x="${i*52}" y="0" width="52" height="${PH}" fill="${i%2?'#3c8a3a':'#357c34'}"/>`;
  s+=`<rect width="${PW}" height="${PH}" fill="url(#dots)"/>`;
  const L=`<rect x="12" y="12" width="496" height="396"/><line x1="260" y1="12" x2="260" y2="408"/><circle cx="260" cy="210" r="40"/>
   <path d="M12 130 h22 a36 36 0 0 1 36 36 v88 a36 36 0 0 1 -36 36 h-22"/><path d="M508 130 h-22 a36 36 0 0 0 -36 36 v88 a36 36 0 0 0 36 36 h22"/>
   <rect x="4" y="180" width="8" height="60"/><rect x="508" y="180" width="8" height="60"/>`;
  return s+`<g fill="none" stroke="#d6453a" stroke-width="2.4" opacity=".45" transform="translate(1.5 1)">${L}</g><g fill="none" stroke="#f7f1de" stroke-width="2.4" opacity=".92">${L}</g><circle cx="260" cy="210" r="3" fill="#f7f1de"/>`;}
function slotXY(k,s){const sl=s<0?GKSLOT:FORMS[fm(k)][s];const d=(sl.y-320)/320,dx=30+d*222;return{x:k==='A'?260-dx:260+dx,y:40+sl.x/400*340,t:sl.t};}
function slotSVG(k,s){const id=get(k,s),T=TEAM[k],{x,y,t}=slotXY(k,s),hot=pick&&pick.k===k&&pick.s===s?' hot':'';
  const ring=`<rect class="ring" x="-36" y="-42" width="72" height="84" fill="none" stroke="#e2b93b" stroke-width="4" stroke-dasharray="7 4" opacity="0"/>`;
  if(!id)return `<g class="slot${hot}" data-team="${k}" data-slot="${s}"><g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(1.12)">${ring}
     <rect x="-31" y="-37" width="62" height="74" fill="${k==='A'?'rgba(27,36,66,.35)':'rgba(251,248,238,.2)'}" stroke="#f7f1de" stroke-width="1.6" stroke-dasharray="5 4"/>
     <text x="0" y="6" text-anchor="middle" font-family="${DISPLAY}" font-size="15" fill="#f7f1de" opacity=".85">${t}</text></g></g>`;
  const p=P(id),face=faceImg(p),cid=`c${k}${s}`.replace('-','m'),nm=p.name.toUpperCase(),tl=nm.length*6.4>54?' textLength="54" lengthAdjust="spacingAndGlyphs"':'';
  const photo=face?`<clipPath id="${cid}"><rect x="-27" y="-33" width="54" height="48"/></clipPath><image href="${esc(face)}" x="-27" y="-33" width="54" height="48" preserveAspectRatio="xMidYMid slice" clip-path="url(#${cid})"/>`
    :`<rect x="-27" y="-33" width="54" height="48" fill="#2c3560"/><circle cx="0" cy="-14" r="10" fill="#8d97c4"/><path d="M-21,15 Q-19,-1 0,-1 Q19,-1 21,15 Z" fill="#8d97c4"/><text x="0" y="-9" text-anchor="middle" font-family="${DISPLAY}" font-size="14" fill="#2c3560">?</text>`;
  return `<g class="mk${hot}" data-team="${k}" data-slot="${s}" role="button" aria-label="${esc(p.name)}, remera ${k==='A'?'oscura':'clara'}">
   <g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot(id)}) scale(1.12)">${ring}
    <rect x="-29" y="-34" width="62" height="74" fill="#000" opacity=".25"/><rect x="-31" y="-37" width="62" height="74" fill="${T.frame}" stroke="#1b2140" stroke-width="1"/>${photo}
    <rect x="-27" y="15" width="54" height="5" fill="#74acdf"/><rect x="-27" y="20" width="54" height="8" fill="#fff"/><rect x="-27" y="28" width="54" height="5" fill="#74acdf"/>
    <text x="0" y="29.5" text-anchor="middle" font-family="${DISPLAY}" font-size="12.5" fill="#1b2140"${tl}>${esc(nm)}</text>
    <g transform="translate(23 -36) scale(.34)"><path d="${SHIRT}" fill="${T.shirt}" stroke="#1b2140" stroke-width="4"/></g>
    <g class="rmx" data-rmx="${id}" role="button" aria-label="Sacar a ${esc(p.name)}"><circle cx="-30" cy="-36" r="15" fill="transparent"/><circle cx="-30" cy="-36" r="8.5" fill="#d6453a" stroke="#fff" stroke-width="2"/><path d="M-33.2 -39.2 l6.4 6.4 m0 -6.4 l-6.4 6.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g></g></g>`;}
function renderPitch(){let s=pitchBase();
  for(const k of['A','B']){s+=slotSVG(k,-1);FORMS[fm(k)].forEach((_,i)=>{s+=slotSVG(k,i);});}
  s+=`<g transform="translate(260 13)" pointer-events="none"><rect x="-46" y="-10" width="92" height="20" fill="#1b2140"/><text y="5.5" text-anchor="middle" font-family="${DISPLAY}" font-size="14" letter-spacing="1" fill="#f7f1de">FÚTBOL PAS</text></g>`;
  if(!placed().length){const c=M.sel.length,t=c<10?`${c}/10 · ELEGÍ ABAJO ↓`:'LISTO: ARMAR PAREJOS ↓',w=t.length*7.4+20;
    s+=`<g class="hint" transform="translate(260 210) rotate(-2)" pointer-events="none"><rect x="${-w/2}" y="-14" width="${w}" height="26" fill="#f7f1de" stroke="#1b2140" stroke-width="1.5"/><text y="5" text-anchor="middle" font-family="${DISPLAY}" font-size="15" fill="#1b2140">${t}</text></g>`;}
  $('pitch').innerHTML=s;syncForms();}
/* Selectores de formación: pegados a las esquinas de abajo de la cancha dibujada */
function syncForms(){for(const k of['A','B']){const el=$('form'+k);if(!el.options.length)el.innerHTML=Object.keys(FORMS).map(f=>`<option value="${f}">${f}</option>`).join('');el.value=fm(k);}}
function placeForms(){const box=$('pitch').parentNode,w=box.clientWidth,h=box.clientHeight,sc=Math.min(w/PW,h/PH);
  box.style.setProperty('--fx',Math.max(0,(w-PW*sc)/2+8*sc)+'px');box.style.setProperty('--fy',Math.max(0,(h-PH*sc)/2+8*sc)+'px');}
try{new ResizeObserver(placeForms).observe($('pitch').parentNode);}catch(e){addEventListener('resize',placeForms);}
for(const k of['A','B'])$('form'+k).addEventListener('change',e=>{M[k].form=e.target.value;
  const f=M[k].s.filter(Boolean),sl=bestSlots(f,M[k].form);M[k].s=[...sl,...Array(4-sl.length).fill(null)];opts=[];pick=null;commit();});
$('pitch').addEventListener('click',e=>{const x=e.target.closest('[data-rmx]');if(x){e.stopPropagation();pick=null;const id=x.dataset.rmx;if(isSel(id))toggle(id);else{const w=where(id);if(w)set(w.k,w.s,null);commit();}return;}
  const g=e.target.closest('[data-team]');if(!g)return;const k=g.dataset.team,s=+g.dataset.slot,id=get(k,s);
  if(!pick){if(id){pick={k,s};renderPitch();}else if(!placed().length)toast(M.sel.length<10?'Primero elegí a los 10 abajo':'Tocá Armar parejos');return;}
  if(pick.k===k&&pick.s===s){pick=null;renderPitch();return;}
  const a=get(pick.k,pick.s);set(pick.k,pick.s,id);set(k,s,a);pick=null;opts=[];commit();});

/* ---------- Arriba: balance y botones ---------- */
$('btnClr').onclick=()=>{const was=M.sel.slice();M.sel=[];for(const k of['A','B']){M[k].gk=null;M[k].s=M[k].s.map(()=>null);}opts=[];pick=null;commit();was.forEach(updateRow);toast('Cancha limpia');};
/* promedio real de cada equipo, en la misma escala de los votos (1 a 5) */
function balInfo(){const na=members('A').length,nb=members('B').length,avA=na?teamVal('A')/na/2:0,avB=nb?teamVal('B')/nb/2:0;
  const pa=na&&nb?Math.round(Math.max(15,Math.min(85,50+(avA-avB)*40))):50;return{avA,avB,pa};}
function renderTop(){renderPitch();const n=placed().length,c=M.sel.length,a=teamVal('A'),b=teamVal('B');
  const{avA,avB,pa}=balInfo();$('barA').style.width=pa+'%';$('barB').style.width=(100-pa)+'%';
  $('barA').textContent=members('A').length?`Oscuros ${fmt1(avA)}`:'Oscuros';$('barB').textContent=members('B').length?`${fmt1(avB)} Claros`:'Claros';
  const v=$('verd');if(n===10){const[l,cl]=verdictOf(Math.abs(a-b));v.textContent=l;v.className='verd '+cl;}else{v.textContent=n?`Faltan ${10-n}`:'—';v.className='verd';}
  $('btnAuto').disabled=c!==10;$('btnAuto').textContent=c===10?'⚖️ Armar parejos':c?`Faltan ${10-c}`:'Elegí 10 abajo';
  $('btnClr').hidden=!n&&!c;$('btnOther').disabled=n!==10;$('btnImg').disabled=n!==10;
  $('cnt').textContent=`${c}/10`;$('cnt').classList.toggle('full',c===10);}
function commit(){save();renderTop();}

$('btnAuto').onclick=()=>{const pl=M.sel.slice();if(pl.length!==10)return;opts=computeOpts(pl);optIdx=0;pick=null;applyOpt(opts[0]);commit();toast('¡Listo! Tocá dos jugadores para cambiarlos',2800);};
$('btnOther').onclick=()=>{if(placed().length!==10)return;if(!opts.length)opts=computeOpts(M.sel.slice());
  optIdx=(optIdx+1)%opts.length;pick=null;applyOpt(opts[optIdx]);commit();toast(`Opción ${optIdx+1} de ${opts.length}`);};

/* ---------- Lista de jugadores ---------- */
const mineOf=id=>VOTACION_ABIERTA&&ME.prof&&ME.prof[id];
function shown(id,k){const m=mineOf(id);if(m&&typeof m[k]==='number')return{v:m[k]+3,st:'mine'};const pr=profOf(id);if(hasAvg(pr,k))return{v:pr[k]+3,st:'avg'};return{v:3,st:'none'};}
function shownPos(id){const m=mineOf(id);if(m)return{p:POS_S.some(x=>x[0]===m.pos)?m.pos:'ANY',st:'mine'};const c=consensus(id),ok=c&&POS_S.some(x=>x[0]===c.pos);return{p:ok?c.pos:'ANY',st:ok?'avg':'none'};}
function metaOf(p){if(p.custom)return['invitado',''];if(!VOTACION_ABIERTA)return['La votación arranca pronto',''];const pr=profOf(p.id),n=pr?pr.n:0,cnt=n?`${n} ${n===1?'voto':'votos'}`:'sin votos';
  if(p.id===ME.who)return[`sos vos · ${cnt}`,''];if(mineOf(p.id))return[`✓ votaste · ${cnt}`,'ok'];return[cnt,''];}
const fmt1=v=>String(Math.round(v*10)/10).replace('.',',');
/* Una barrita, dos valores: el relleno y la marca = promedio del grupo; la perilla = tu voto (hueca si todavía no votaste). */
function slInfo(id,k){const m=mineOf(id),pr=profOf(id),my=m&&typeof m[k]==='number'&&(!m._t||m._t[k])?m[k]+3:null,av=hasAvg(pr,k)?pr[k]+3:null;
  return{my,av,t:my??av??3,cls:'sl '+(my!=null?'mine':'ghost')+(av!=null?'':' noavg'),
    short:av!=null?fmt1(av):'',
    full:[my!=null?`tu voto ${my}`:'',av!=null?`promedio ${fmt1(av)}`:''].filter(Boolean).join(' · ')||'sin votos'};}
const hueOf=v=>45+(v-1)*22.5;
function slApply(el,o){el.style.setProperty('--t',(o.t-1)/4);if(o.my!=null)el.style.setProperty('--hue',hueOf(o.my));el.querySelector('.tr em').textContent=o.my??'';el.style.setProperty('--a',o.av!=null?(o.av-1)/4:0);el.querySelector('.lb b').textContent=o.short;el.querySelector('.tr b').textContent=o.full;
  el.setAttribute('aria-valuenow',Math.round(o.t));el.setAttribute('aria-valuetext',o.full);}
function slHTML(id,k,full,name,off){const o=slInfo(id,k);
  return `<div class="${o.cls}" data-sl="${id}" data-k="${k}" role="slider" tabindex="${off?-1:0}"${off?' aria-disabled="true"':''} aria-label="${full} de ${esc(name)}" aria-valuemin="1" aria-valuemax="5" aria-valuenow="${Math.round(o.t)}" aria-valuetext="${o.full}" style="--t:${(o.t-1)/4};--a:${o.av!=null?(o.av-1)/4:0}${o.my!=null?';--hue:'+hueOf(o.my):''}"><span class="lb">${full}<b>${off?'':o.short}</b></span><span class="tr"><i></i><u></u><u></u><u></u><u></u><u></u><s></s><em>${o.my??''}</em><b>${o.full}</b></span></div>`;}
function rowHTML(p){const on=isSel(p.id),me=p.id===ME.who,cu=!!p.custom,ctl=!cu&&!me,off=!VOTACION_ABIERTA,sp=shownPos(p.id),[mt,mc]=metaOf(p);
  return `<div class="row${on?' on':''}${ctl?' vot':''}" data-row="${p.id}">
   <button type="button" class="face" data-pick="${p.id}" aria-pressed="${on}" aria-label="${esc(p.name)}: juega">${cardThumb(p)}<span class="ck">✓</span></button>
   <div class="rm"><div class="rt"><button type="button" class="nm" data-pick="${p.id}" tabindex="-1"><span>${esc(p.name)}</span><small class="${mc}">${mt}</small></button>
    ${cu?`<button type="button" class="rmv" data-rm="${p.id}" aria-label="Quitar a ${esc(p.name)}">✕</button>`:''}</div>
    ${ctl?`<div class="ctl${off?' off':''}"><span class="cl" id="pl-${p.id}">Posición</span><span class="pos" role="group" aria-labelledby="pl-${p.id}">${POS_S.map(([k,l])=>`<button type="button" data-pos="${p.id}" data-p="${k}" aria-pressed="${!off&&sp.p===k}" class="${sp.st}"${off?' disabled':''}>${l}</button>`).join('')}</span>
    <div class="sls">${ATTRS.map(([k,full])=>slHTML(p.id,k,full,p.name,off)).join('')}</div></div>`:''}</div></div>`;}
let SL=null,listDirty=false;

  $('soy').innerHTML=`<option value="">No digo</option>`+ROSTER.map(p=>`<option value="${p.id}"${ME.who===p.id?' selected':''}>${esc(p.name)}</option>`).join('');

/* Actualiza una fila sin rearmarla (no corta el arrastre de la barrita) */
function updateRow(id){const r=document.querySelector(`[data-row="${id}"]`),p=P(id);if(!r||!p)return;const on=isSel(id);
  r.classList.toggle('on',on);r.querySelector('.face').setAttribute('aria-pressed',on);
  const[mt,mc]=metaOf(p),sm=r.querySelector('.nm small');sm.textContent=mt;sm.className=mc;if(!VOTACION_ABIERTA)return;
  r.querySelectorAll('[data-sl]').forEach(el=>{const o=slInfo(id,el.dataset.k),keep=['drag','show','tick','set'].filter(c=>el.classList.contains(c));el.className=o.cls+(keep.length?' '+keep.join(' '):'');slApply(el,o);});
  const sp=shownPos(id);r.querySelectorAll('[data-pos]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.p===sp.p);b.className=sp.st;});}

/* Elegir / sacar: elegir no lo pone en la cancha; si ya está armada y hay un lugar libre, entra ahí. */
function toggle(id){if(isSel(id)){M.sel.splice(M.sel.indexOf(id),1);const w=where(id);if(w)set(w.k,w.s,null);if(pick&&w&&pick.k===w.k&&pick.s===w.s)pick=null;}
  else{if(M.sel.length>=10){toast('Ya hay 10. Sacá a alguien primero.');return;}M.sel.push(id);
    if(placed().length){const ks=['A','B'].sort((x,y)=>members(x).length-members(y).length);
      for(const k of ks){if(members(k).length>=5)continue;if(!M[k].gk)M[k].gk=id;else M[k].s[M[k].s.indexOf(null)]=id;break;}}}
  opts=[];updateRow(id);commit();}

/* Calificar: lo que movés es tu opinión (secreta) y se guarda sola. */
function setMine(id,patch){if(!VOTACION_ABIERTA)return;ME.prof=ME.prof||{};let m=ME.prof[id];
  if(!m){m={};for(const[k]of ATTRS)m[k]=Math.max(-2,Math.min(2,Math.round(shown(id,k).v)-3));m.pos=shownPos(id).p;ME.prof[id]=m;}
  else if(Object.keys(patch).every(k=>m[k]===patch[k]&&m._t&&m._t[k]))return;
  if(!m._t)m._t={};for(const k in patch)m._t[k]=1;Object.assign(m,patch);editSeq++;ME.pDirty=true;ME.pending=true;vsave();scheduleSync(1500);updateRow(id);syncUI();}
let bubT=null;function bub(el){document.querySelectorAll('.sl.show').forEach(x=>x!==el&&x.classList.remove('show'));el.classList.add('show');clearTimeout(bubT);bubT=setTimeout(()=>el.classList.remove('show'),1800);}
const rows=$('rows');
rows.addEventListener('click',e=>{const b=e.target.closest('[data-pick],[data-pos],[data-rm]');if(!b)return;
  if(b.dataset.pick)toggle(b.dataset.pick);
  else if(b.dataset.pos)setMine(b.dataset.pos,{pos:b.dataset.p});

let lastScroll=0;$('list').addEventListener('scroll',()=>{lastScroll=Date.now();},{passive:true});
/* Arrastre: la perilla sigue al dedo en continuo y el voto (1 a 5) se fija al paso más cercano; al soltar encaja.
   Deslizar en vertical sigue siendo scroll de la lista. Un toque sin mover pone el valor donde tocaste. */
function slFrac(el,x){const tr=el.querySelector('.tr').getBoundingClientRect(),h=12;return Math.max(0,Math.min(1,(x-tr.left-h)/Math.max(1,tr.width-2*h)));}
function slPulse(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function slDrag(el,x){const f=slFrac(el,x),v=1+Math.round(f*4);bub(el);
  if(el._v!==v){if(el._v!=null){slPulse(el,'tick');try{navigator.vibrate&&navigator.vibrate(8);}catch(_){}}el._v=v;}
  setMine(el.dataset.sl,{[el.dataset.k]:v-3});el.style.setProperty('--t',f);el.style.setProperty('--hue',hueOf(v));el.querySelector('.tr em').textContent=v;}
function slSet(el,x){bub(el);const v=1+Math.round(slFrac(el,x)*4);setMine(el.dataset.sl,{[el.dataset.k]:v-3});}
function slStart(el,x){SL.act=true;el.classList.add('drag');slDrag(el,x);}
function slFinish(cancel,x,y){const s=SL;SL=null;if(!s)return;s.el.classList.remove('drag','tick');s.el._v=null;
  if(!cancel){if(s.act)slSet(s.el,s.lx);else if(Math.abs(x-s.x)<8&&Math.abs(y-s.y)<8&&Date.now()-s.t0<600&&s.t0-lastScroll>200)slSet(s.el,x);}
  updateRow(s.el.dataset.sl);if(!cancel&&s.el.classList.contains('mine')){slPulse(s.el,'set');const r=s.el.closest('.row');if(r)slPulse(r,'voted');}if(listDirty)renderList();}
/* touch (celular) */
rows.addEventListener('touchstart',e=>{if(e.touches.length!==1){SL=null;return;}const el=e.target.closest('[data-sl]');if(!el||!VOTACION_ABIERTA||el.closest('.off'))return;
  const t=e.touches[0];SL={el,x:t.clientX,y:t.clientY,lx:t.clientX,act:false,touch:true,t0:Date.now()};},{passive:true});
rows.addEventListener('touchmove',e=>{if(!SL||!SL.touch)return;const t=e.touches[0],dx=t.clientX-SL.x,dy=t.clientY-SL.y;SL.lx=t.clientX;
  if(!SL.act){if(Math.abs(dx)>4&&Math.abs(dx)>=Math.abs(dy)*0.8)slStart(SL.el,t.clientX);else if(Math.abs(dy)>8){SL=null;if(listDirty)renderList();return;}else return;}
  if(e.cancelable)e.preventDefault();slDrag(SL.el,t.clientX);},{passive:false});
rows.addEventListener('touchend',e=>{if(!SL||!SL.touch)return;const t=e.changedTouches[0];if(SL.act&&e.cancelable)e.preventDefault();slFinish(false,t.clientX,t.clientY);},{passive:false});
rows.addEventListener('touchcancel',()=>{if(SL&&SL.touch)slFinish(true,0,0);});
/* mouse (compu) */
rows.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button>0)return;const el=e.target.closest('[data-sl]');if(!el||!VOTACION_ABIERTA||el.closest('.off'))return;
  SL={el,x:e.clientX,y:e.clientY,lx:e.clientX,act:false,pid:e.pointerId,t0:Date.now()};try{el.setPointerCapture(e.pointerId);}catch(_){}slStart(el,e.clientX);});
rows.addEventListener('pointermove',e=>{if(!SL||SL.touch||e.pointerId!==SL.pid)return;SL.lx=e.clientX;slDrag(SL.el,e.clientX);});
rows.addEventListener('pointerup',e=>{if(SL&&!SL.touch&&e.pointerId===SL.pid)slFinish(false,e.clientX,e.clientY);});
rows.addEventListener('pointercancel',e=>{if(SL&&!SL.touch&&e.pointerId===SL.pid)slFinish(true,0,0);});
rows.addEventListener('keydown',e=>{const el=e.target.closest('[data-sl]');if(!el||!VOTACION_ABIERTA)return;const cur=Math.round(slInfo(el.dataset.sl,el.dataset.k).t);bub(el);
  const nv={ArrowRight:cur+1,ArrowUp:cur+1,ArrowLeft:cur-1,ArrowDown:cur-1,Home:1,End:5}[e.key];if(nv===undefined)return;e.preventDefault();setMine(el.dataset.sl,{[el.dataset.k]:Math.max(1,Math.min(5,nv))-3});});
$('soy').onchange=e=>{ME.who=e.target.value;if(ME.who&&ME.prof)delete ME.prof[ME.who];vsave();renderList();};

  const p={id:'c'+Date.now().toString(36),name,custom:true};DB.custom.push(p);$('aName').value='';save();renderList();if(M.sel.length<10)toggle(p.id);toast(`${name} sumado`);});

/* Tip de una sola vez */

$('tipT').innerHTML=VOTACION_ABIERTA?'<b>Votá</b> arrastrando las barritas: la barra de color es el promedio del grupo y la perilla con número, tu voto. Es secreto y se guarda solo. <b>Tocá la figurita</b> de los 10 que juegan.':'Tocá las caras de los 10 que juegan. La votación arranca pronto.';

/* ---------- Compartir imagen ---------- */
const toDataURL=url=>fetch(url).then(r=>r.blob()).then(b=>new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(b);}));
let imgBlob=null;
/* La imagen para compartir es vertical (como la versión anterior): Oscuros arriba, Claros abajo, figuritas con nombre y cinta de posición. */
function vBase(){let s='<defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r=".8" fill="#000" opacity=".13"/></pattern></defs>';
  for(let i=0;i<10;i++)s+=`<rect x="0" y="${i*64}" width="400" height="64" fill="${i%2?'#3c8a3a':'#357c34'}"/>`;
  s+='<rect width="400" height="640" fill="url(#dots)"/>';
  const L='<rect x="18" y="18" width="364" height="604"/><line x1="18" y1="320" x2="382" y2="320"/><circle cx="200" cy="320" r="46"/>'+
   '<path d="M110 18 v22 a40 40 0 0 0 40 40 h100 a40 40 0 0 0 40 -40 v-22"/><path d="M110 622 v-22 a40 40 0 0 1 40 -40 h100 a40 40 0 0 1 40 40 v22"/>'+
   '<rect x="168" y="8" width="64" height="10"/><rect x="168" y="622" width="64" height="10"/>';
  return s+`<g fill="none" stroke="#d6453a" stroke-width="2.6" opacity=".45" transform="translate(1.6 1.1)">${L}</g><g fill="none" stroke="#f7f1de" stroke-width="2.6" opacity=".92">${L}</g><circle cx="200" cy="320" r="3" fill="#f7f1de"/>`;}
function vSlot(k,s,x,y,label,faces){const id=get(k,s);if(!id)return '';const T=TEAM[k],lw=Math.max(46,label.length*5.4+10),ly=k==='A'&&s!==-1?-52:36;
  const tape=`<rect x="${-lw/2}" y="${ly}" width="${lw}" height="12" fill="#f7f1de" opacity=".92" stroke="#1b2140" stroke-opacity=".25"/><text x="0" y="${ly+9}" text-anchor="middle" font-family="${TYPE}" font-weight="700" font-size="8.5" fill="#1b2140">${esc(label.toUpperCase())}</text>`;
  const p=P(id),face=faces[id],cid=`v${k}${s}`.replace('-','m'),nm=p.name.toUpperCase(),tl=nm.length*6.2>50?' textLength="50" lengthAdjust="spacingAndGlyphs"':'';
  const photo=face?`<clipPath id="${cid}"><rect x="-27" y="-33" width="54" height="50"/></clipPath><image href="${face}" x="-27" y="-33" width="54" height="50" preserveAspectRatio="xMidYMid slice" clip-path="url(#${cid})"/>`
    :'<rect x="-27" y="-33" width="54" height="50" fill="#2c3560"/><circle cx="0" cy="-14" r="10" fill="#8d97c4"/><path d="M-21,17 Q-19,-1 0,-1 Q19,-1 21,17 Z" fill="#8d97c4"/><text x="0" y="-9" text-anchor="middle" font-family="'+DISPLAY+'" font-size="14" fill="#2c3560">?</text>';
  return `<g transform="translate(${x} ${y}) rotate(${rot(id)}) scale(1.22)">
    <rect x="-30" y="-35" width="64" height="76" fill="#000" opacity=".25"/><rect x="-32" y="-38" width="64" height="76" fill="${T.frame}" stroke="#1b2140" stroke-width="1"/>${photo}
    <rect x="-27" y="18" width="54" height="5" fill="#74acdf"/><rect x="-27" y="23" width="54" height="5" fill="#fff"/><rect x="-27" y="28" width="54" height="5" fill="#74acdf"/>
    <text x="0" y="31" text-anchor="middle" font-family="${DISPLAY}" font-size="11" fill="#1b2140"${tl}>${esc(nm)}</text>
    <g transform="translate(23 -36) scale(.33)"><path d="${SHIRT}" fill="${T.shirt}" stroke="#1b2140" stroke-width="4"/></g>
    <g transform="rotate(${-rot(id)*2})">${tape}</g></g>`;}
async function vPitchSVG(){const faces={};
  for(const id of placed()){const u=faceImg(P(id));if(!u)continue;try{faces[id]=u.startsWith('data:')?u:await toDataURL(u);}catch(e){}}
  let s=vBase();
  for(const k of['A','B']){const Y=y=>k==='A'?640-y:y;s+=vSlot(k,-1,GKSLOT.x,Y(GKSLOT.y),GKSLOT.l,faces);FORMS[fm(k)].forEach((sl,i)=>{s+=vSlot(k,i,sl.x,Y(sl.y),sl.l,faces);});}
  s+=`<g transform="translate(26 40) rotate(-4)"><rect x="-4" y="-16" width="104" height="22" fill="#1b2442"/><text x="2" y="1" font-family="${DISPLAY}" font-size="15" fill="#f7f1de">REMERA OSCURA</text></g>`;
  s+=`<g transform="translate(278 612) rotate(3)"><rect x="-4" y="-16" width="100" height="22" fill="#fbf8ee" stroke="#1b2140"/><text x="2" y="1" font-family="${DISPLAY}" font-size="15" fill="#1b2140">REMERA CLARA</text></g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="800" height="1280">${s}</svg>`;}
async function pitchPng(){const src=await vPitchSVG();
  const img=new Image();await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src);});
  const c=document.createElement('canvas');c.width=840;c.height=1470;const g=c.getContext('2d');
  g.fillStyle='#efe5cc';g.fillRect(0,0,840,1470);g.fillStyle='#1b2140';g.fillRect(14,14,812,1292);g.drawImage(img,20,20,800,1280);
  const a=teamVal('A'),b=teamVal('B'),{avA,avB,pa}=balInfo(),[lab]=verdictOf(Math.abs(a-b));
  g.textBaseline='middle';const t=lab.toUpperCase();g.font='bold 30px "Courier Prime","Courier New",monospace';const w=g.measureText(t).width+44;
  g.save();g.translate(420,1350);g.rotate(-.035);g.strokeStyle='#1b2140';g.lineWidth=4;g.strokeRect(-w/2,-25,w,50);g.fillStyle='#1b2140';g.textAlign='center';g.fillText(t,0,2);g.restore();
  const bx=40,by=1395,bw=760,bh=44,wa=Math.round(bw*pa/100);g.fillStyle='#1b2442';g.fillRect(bx,by,wa,bh);g.fillStyle='#fbf8ee';g.fillRect(bx+wa,by,bw-wa,bh);
  g.strokeStyle='#1b2140';g.lineWidth=3;g.strokeRect(bx,by,bw,bh);g.fillStyle='#e2b93b';g.fillRect(bx+bw/2-2,by-4,4,bh+8);
  g.font='26px Anton, Impact, sans-serif';g.textAlign='left';g.fillStyle='#f7f1de';g.fillText(`OSCUROS ${fmt1(avA)}`,bx+12,by+bh/2+1);g.textAlign='right';g.fillStyle='#1b2140';g.fillText(`${fmt1(avB)} CLAROS`,bx+bw-12,by+bh/2+1);
  return new Promise((ok,ko)=>c.toBlob(bl=>bl?ok(bl):ko(),'image/png'));}
$('btnImg').onclick=async()=>{if(placed().length<10)return;try{imgBlob=await pitchPng();$('imgOut').src=URL.createObjectURL(imgBlob);
  let can=false;try{can=!!(navigator.canShare&&navigator.canShare({files:[new File([imgBlob],'partido.png',{type:'image/png'})]}));}catch(e){}
  $('imgShare').hidden=!can;$('imgDlg').showModal();}catch(e){toast('No se pudo generar la imagen');}};
$('imgShare').onclick=()=>{navigator.share({files:[new File([imgBlob],'partido.png',{type:'image/png'})]}).catch(()=>{});};
$('imgCopy').onclick=()=>{try{navigator.clipboard.write([new ClipboardItem({'image/png':imgBlob})]).then(()=>toast('Imagen copiada'),()=>toast('Mantené apretada la imagen para copiarla'));}catch(e){toast('Mantené apretada la imagen para copiarla');}};

/* ---------- Calificaciones (secretas, por dispositivo) ---------- */
const VOTE_URL='https://script.google.com/macros/s/AKfycbzELKhJomhoqm93U8o7ueskgDl-ikr8EzPYUgSbEZb4RCgQUU5z5gg0BPFebgbnJ9JR/exec';
const VK='pas-votos-v1';
let VS={players:{},voters:0},ME={id:null,who:'',sent:false};
function vload(){if(!VOTACION_ABIERTA){try{const d=JSON.parse(localStorage.getItem(VK)||'null');if(d){ME=Object.assign(ME,d.me||{});}}catch(e){}VS={players:{},voters:0};vsave();return;}try{const d=JSON.parse(localStorage.getItem(VK)||'null');if(d){ME=Object.assign(ME,d.me||{});VS=d.vs||VS;}}catch(e){}
  if(ME.who==null)ME.who='';delete ME.notes;delete ME.stars;delete ME.pos;
  if(!ME.id){ME.id=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');vsave();}}
function vsave(){try{localStorage.setItem(VK,JSON.stringify({me:ME,vs:VS}));}catch(e){}}
function refresh(){renderTop();renderList();}
async function fetchVotes(){if(!VOTACION_ABIERTA||!VOTE_URL)return;try{const r=await fetch(VOTE_URL);const d=await r.json();if(d&&d.players){const same=JSON.stringify(d)===JSON.stringify(VS);VS=d;if(!same){vsave();refresh();}}}catch(e){}}
/* Guardado automático: se manda sola unos segundos después; si no hay señal, queda pendiente y se reintenta. */
let syncTimer=null,syncing=false,syncFails=0,syncState='',editSeq=0;
function scheduleSync(ms){clearTimeout(syncTimer);syncTimer=setTimeout(syncVotes,ms);}
async function syncVotes(){if(!VOTACION_ABIERTA||!VOTE_URL||!ME.pending)return;if(syncing){scheduleSync(1200);return;}
  const votes={},profile={};if(ME.pDirty)for(const k in ME.prof||{})if(k!==ME.who&&P(k)&&!P(k).custom){const{_t,...o}=ME.prof[k],sd={};for(const x in o)if(!_t||_t[x])sd[x]=o[x];if(Object.keys(sd).length)profile[k]=sd;}
  if(!Object.keys(profile).length){ME.pending=false;vsave();syncUI();return;}
  syncing=true;syncState='saving';syncUI();const seq=editSeq;
  try{const r=await fetch(VOTE_URL,{method:'POST',body:JSON.stringify({voter:ME.id,who:ME.who||'',votes,profile})});const d=await r.json();
    if(!d||!d.players)throw new Error('respuesta inválida');VS=d;ME.sent=true;syncFails=0;
    /* si se movió algo mientras se mandaba, queda pendiente y se manda de nuevo */
    if(seq===editSeq){ME.pDirty=false;ME.pending=false;syncState='ok';}else scheduleSync(1500);vsave();refresh();}
  catch(e){syncFails++;syncState='retry';scheduleSync(Math.min(60000,4000*syncFails));}
  finally{syncing=false;syncUI();}}
window.addEventListener('online',()=>{if(ME.pending)scheduleSync(500);});
function syncUI(){const el=$('sync');
  if(syncState==='retry'){el.textContent='sin señal, reintenta';el.className='sync err';}
  else if(ME.pending||syncState==='saving'){el.textContent='guardando…';el.className='sync wait';}
  else if(syncState==='ok'){el.textContent='✓ guardado';el.className='sync';}
  else{el.textContent='';el.className='sync';}}

load();vload();renderTop();renderList();placeForms();fetchVotes();if(VOTACION_ABIERTA&&ME.pending)scheduleSync(2000);setInterval(()=>{if(!document.hidden)fetchVotes();},60000);
</script>
